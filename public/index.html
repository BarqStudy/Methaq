<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121417">
  <title>ميثاق التركيز | Lock-in Duo</title>
  <link rel="stylesheet" href="/utilities.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top"><div class="shell top-inner">
    <a class="brand" href="/" aria-label="ميثاق التركيز"><span class="logo"><i data-icon="lock-keyhole"></i></span><span>ميثاق التركيز<small>LOCK-IN DUO</small></span></a>
    <div class="account" id="account"></div>
  </div></header>
  <main class="shell" id="page"></main>
  <footer class="shell footer">
    <span><i data-icon="lock-keyhole"></i> ميثاق التركيز <b>·</b> مساحة للإنجاز معًا</span>
    <nav aria-label="التنقل الرئيسي">
      <button data-tab="home" class="selected"><i data-icon="house"></i>الرئيسية</button>
      <button data-tab="stats"><i data-icon="chart-no-axes-column"></i>الإحصائيات</button>
      <button data-tab="store"><i data-icon="shopping-bag"></i>المتجر</button>
    </nav>
  </footer>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
