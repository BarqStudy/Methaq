<!doctype html>
<html lang="ar" dir="rtl" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ميثاق التركيز | Lock-in Duo</title>
  <link rel="stylesheet" href="/utilities.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top"><div class="shell top-inner">
    <div class="brand"><span class="logo"><i data-icon="lock-keyhole" aria-hidden="true"></i></span><span>ميثاق التركيز<small>LOCK-IN DUO</small></span></div>
    <div class="account" id="account"></div>
    <button type="button" class="appearance-toggle" id="appearance-toggle" data-action="appearanceMenu" aria-label="مظهر المنصة" aria-haspopup="dialog"></button>
  </div></header>
  <main class="shell" id="page"></main>
  <nav class="dock" aria-label="التنقل الرئيسي">
    <button type="button" data-tab="home" aria-current="page"><i data-icon="house" aria-hidden="true"></i><span>الرئيسية</span></button>
    <button type="button" data-tab="stats"><i data-icon="chart-no-axes-column" aria-hidden="true"></i><span>الإحصائيات</span></button>
    <button type="button" data-tab="store"><i data-icon="shopping-bag" aria-hidden="true"></i><span>المتجر</span></button>
  </nav>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
