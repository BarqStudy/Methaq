<!doctype html>
<html lang="ar" dir="rtl" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ميثاق التركيز | Lock-in Duo</title>
  <link rel="stylesheet" href="/utilities.css?v=20261120-5">
  <link rel="stylesheet" href="/app.css?v=20261123-3">
  <script src="/socket.io/socket.io.js" defer></script>
  <script type="module" src="/app.js?v=20261123-4"></script>
</head>
<body>
  <header class="top"><div class="shell top-inner">
    <div class="brand"><span class="logo methaq-mark"><svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="11" cy="20" r="5"/><circle cx="29" cy="20" r="5"/><path d="M16 20h8"/></svg></span><span>مِيثاق</span></div>
    <button type="button" class="upgrade-top" id="upgrade-top" data-action="seePlans"><i data-icon="crown" aria-hidden="true"></i> ترقية</button>
    <button type="button" class="appearance-toggle" id="appearance-toggle" data-action="appearanceMenu" aria-label="مظهر المنصة" aria-haspopup="dialog"></button>
    <button type="button" id="admin-toggle" class="admin-toggle secondary" data-action="openAdmin" hidden><i data-icon="shield" aria-hidden="true"></i> الإدارة</button>
    <div class="metrics top-metrics" id="account" role="group" aria-label="ملخص حسابك"></div>
  </div></header>
  <main class="shell" id="page"></main>
  <aside class="wethaq-guide" id="wethaq-guide" aria-live="polite">
    <button type="button" class="wethaq-close" id="wethaq-close" aria-label="إخفاء وِثاق">×</button>
    <button type="button" class="wethaq-character" id="wethaq-character" aria-label="افتح مساعد وِثاق أو اسحبه لتغيير مكانه"><img src="/assets/wethaq.webp" alt="وِثاق"></button>
    <div class="wethaq-bubble is-visible" id="wethaq-bubble"><button type="button" class="wethaq-panel-close" id="wethaq-panel-close" aria-label="إغلاق نافذة المساعد">×</button><strong>مساعد وِثاق</strong><div id="wethaq-content"><p id="wethaq-message">اضغط عليّ واسألني عن أي قسم في المنصة.</p></div><small>تقدر تسحب الشخصية لأي مكان في الشاشة</small></div>
  </aside>
  <button type="button" class="wethaq-restore" id="wethaq-restore" hidden>إظهار وِثاق</button>
  <nav class="dock" aria-label="التنقل الرئيسي">
    <button type="button" data-tab="home" aria-current="page"><i data-icon="house" aria-hidden="true"></i><span>الرئيسية</span></button>
    <button type="button" data-tab="rooms"><i data-icon="door-open" aria-hidden="true"></i><span>انضم لغرفة</span></button>
    <button type="button" data-tab="stats"><i data-icon="chart-no-axes-column" aria-hidden="true"></i><span>الإحصائيات</span></button>
    <button type="button" data-tab="store"><i data-icon="shopping-bag" aria-hidden="true"></i><span>المتجر</span></button>
    <button type="button" data-tab="inventory"><i data-icon="package-open" aria-hidden="true"></i><span>المخزون</span></button>
  </nav>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
